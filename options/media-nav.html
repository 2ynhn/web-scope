<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미디어 이동 설정 - Web Scope</title>
<link rel="stylesheet" href="../common/ui.css">
<link rel="stylesheet" href="options.css">
</head>
<body data-feature="mediaNav">
  <main>
    <p class="lead">페이지에 이미지·영상이 여럿 있으면 <kbd>PageDown</kbd> / <kbd>PageUp</kbd> 키로 다음·이전 미디어 위치로 스크롤합니다.</p>

    <section>
      <h2>작동 조건</h2>
      <div class="field">
        <div class="label">최소 가로 (px)</div>
        <input type="number" data-key="minWidth" min="1" max="10000">
      </div>
      <div class="field">
        <div class="label">최소 세로 (px)</div>
        <input type="number" data-key="minHeight" min="1" max="10000">
      </div>
      <div class="field">
        <div class="label">최소 개수<small>조건에 맞는 미디어가 이보다 적으면 원래 PageDown/PageUp 동작</small></div>
        <input type="number" data-key="minCount" min="1" max="100">
      </div>
      <div class="field">
        <div class="label">영상 포함</div>
        <label class="switch"><input type="checkbox" data-key="includeVideo"><span class="slider"></span></label>
      </div>
    </section>

    <section>
      <h2>스크롤</h2>
      <div class="field">
        <div class="label">위쪽 여백 (px)<small>이동 후 미디어 위에 남길 공간</small></div>
        <input type="number" data-key="topMargin" min="0" max="500">
      </div>
      <div class="field">
        <div class="label">부드럽게 스크롤</div>
        <label class="switch"><input type="checkbox" data-key="smooth"><span class="slider"></span></label>
      </div>
    </section>
  </main>
  <script src="../common/defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
